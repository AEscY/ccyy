# ===== RPC 配置 =====
rpc:
  ethereum: "https://eth.llamarpc.com"
  polygon: "https://polygon.llamarpc.com"
  arbitrum: "https://arb1.arbitrum.io/rpc"
  optimism: "https://mainnet.optimism.io"
  base: "https://base.llamarpc.com"
  bsc: "https://bsc.llamarpc.com"
  solana: "https://api.mainnet-beta.solana.com"
  linea: "https://rpc.linea.build"

# ===== CryptoRank 配置 =====
cryptorank:
  api_key: ""
  base_url: "https://api.cryptorank.io/v1"

# ===== MCP 配置 =====
mcp:
  endpoint: "https://web3-discover.vercel.app/api/mcp"
  enabled: true

# ===== 扫描配置 =====
scanner:
  min_score: 60
  max_items: 20
  timeout: 15
  sources:
    - mcp
    - cryptorank
    - web3_discover

# ===== 执行配置 =====
executor:
  max_gas_price: 50
  cooldown_seconds: 60
  dry_run: false

# ===== 企业级机器人配置 =====
enterprise_bots:
  kite_ai:
    enabled: true
    auto_farm: true
  pharos:
    enabled: true
    auto_daily: true
  lootbot:
    enabled: false  # 需要 Telegram 集成