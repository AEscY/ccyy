# 三位一体空投系统配置

# Telegram 配置（通过环境变量设置）
telegram:
  enabled: true

# RPC 配置
rpc:
  ethereum: "https://eth.llamarpc.com"
  polygon: "https://polygon.llamarpc.com"
  arbitrum: "https://arb1.arbitrum.io/rpc"
  optimism: "https://mainnet.optimism.io"
  base: "https://base.llamarpc.com"
  bsc: "https://bsc.llamarpc.com"
  avalanche: "https://api.avax.network/ext/bc/C/rpc"

# 扫描配置
scanner:
  min_score: 60
  max_items: 20
  timeout: 15

# 模块配置
modules:
  hunter:
    enabled: true
    max_projects: 20
  agent:
    enabled: true
    max_strategies: 15
  bots:
    kite_ai:
      enabled: true
      interval_hours: 6
    pharos:
      enabled: true
      interval_hours: 6